<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- The B2 root system: short roots in blue, long roots (√2 longer) in yellow. -->
  <rect x="-50" y="-50" width="100" height="100" rx="22" fill="#fcfbf8"/>
  <g stroke-width="7" stroke-linecap="round">
    <g stroke="#3c66a8">
      <line x1="0" y1="0" x2="27" y2="0"/><line x1="0" y1="0" x2="-27" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="27"/><line x1="0" y1="0" x2="0" y2="-27"/>
    </g>
    <g stroke="#eeaa22">
      <line x1="0" y1="0" x2="27" y2="27"/><line x1="0" y1="0" x2="-27" y2="27"/>
      <line x1="0" y1="0" x2="27" y2="-27"/><line x1="0" y1="0" x2="-27" y2="-27"/>
    </g>
  </g>
  <circle r="8" fill="#20242e"/>
</svg>
